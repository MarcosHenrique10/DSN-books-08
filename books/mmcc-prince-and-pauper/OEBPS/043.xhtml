    <p>
      <span class="font-6">
      <span id="w1227">Pete</span> 
      <span id="w1228">grabbed</span>
      <span id="w1229">Mickey,</span>
      <span id="w1230">and</span>
      <span id="w1231">told</span>
      <span id="w1232">him</span>
      <span id="w1233">the</span>
      <span id="w1234">king</span>
      <span id="w1235">was</span>
      <span id="w1236">dead.</span> 
      <span id="w1237">&#8220;And</span> 
      <span id="w1238">if</span>
      <span id="w1239">you</span>
      <br/>
      <span id="w1240">don&#8217;t</span>
      <span id="w1241">do</span>
      <span id="w1242">everything</span>
      <span id="w1243">I</span> 
      <span id="w1244">say . . .&#8221;</span>
      <span id="w1245">He</span>
      <span id="w1246">pointed</span>
      <span id="w1247">toward</span> 
      <span id="w1248">a</span> 
      <span id="w1249">corner,</span> 
      <span id="w1250">where</span> 
      <span id="w1251">Pluto</span> 
      <br/>
      <span id="w1252">was</span>
      <span id="w1253">tied</span> 
      <span id="w1254">up</span> 
      <span id="w1255">with</span>
      <span id="w1256">a</span> 
      <span id="w1257">heavy</span> 
      <span id="w1258">rope.</span> 
      <span id="w1259">Pete</span> 
      <span id="w1260">knew</span> 
      <span id="w1261">Mickey</span>
      <span id="w1262">wasn&#8217;t</span>
      <span id="w1263">the</span>
      <span id="w1264">real</span> 
      <span id="w1265">prince!</span> 
      </span>
    </p>
    <p>
      <span class="font-6">
        <span id="w1266">Before</span>
        <span id="w1267">Mickey</span>
        <span id="w1268">could</span>
        <span id="w1269">speak,</span>
        <span id="w1270">he</span>
        <span id="w1271">heard</span>
        <span id="w1272">the</span>
        <span id="w1273">sound</span>
        <span id="w1274">of</span>
        <span id="w1275">church</span>
        <span id="w1276">bells</span>
        <span id="w1277">tolling</span>
        <br/>
        <span id="w1278">the</span>
        <span id="w1279">king&#8217;s</span>
        <span id="w1280">death.</span>
      </span>
