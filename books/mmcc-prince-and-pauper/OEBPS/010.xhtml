        <span id="w204">Mickey</span>
        <span id="w205">pounded</span>
        <span id="w206">on</span>
        <span id="w207">the</span>
        <span id="w208">gate.</span>
        <span id="w209">A</span>
        <span id="w210">surprised</span>
        <span id="w211">guard</span>
        <span id="w212">let</span>
        <span id="w213">him</span>
        <span id="w214">in,</span>
        <br/>
        <span id="w215">addressing</span>
        <span id="w216">him</span>
        <span id="w217">as</span>
        <span id="w218">if</span>
        <span id="w219">he</span>
        <span id="w220">were</span>
        <span id="w221">the</span>
        <span id="w222">prince!</span>
        <span id="w223">Captain</span>
        <span id="w224">Pete</span>
        <span id="w225">overheard,</span>

        <span id="w227">to</span>
        <span id="w228">a</span>
        <span id="w229">lighted</span>
        <span id="w230">window,</span>
        <span id="w231">and</span>
        <span id="w232">asked,</span>
        <span id="w233">&#8220;Then</span>
        <span id="w234">who&#8217;s</span>
        <span id="w235">that</span>
        <span id="w236">up</span>
        <br/>
        <span id="w237">there?&#8221;</span>
        <span id="w238">In</span>
        <span id="w239">the</span>
        <span id="w240">window</span>
        <span id="w241">they</span>
        <span id="w242">could</span>
        <span id="w243">see</span>
        <span id="w244">the</span>
        <span id="w245">silhouette</span>
        <span id="w246">of</span>
        <span id="w247">someone</span>
        <br/>
        <span id="w248">who</span>
        <span id="w249">looked</span>
        <span id="w250">exactly</span>
        <span id="w251">like</span>
