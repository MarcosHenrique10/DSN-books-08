      <span class="font-4a" style="color:#FFFFFF;">
        <span id="w851">Everyone</span>
        <span id="w852">enjoys</span>
        <span id="w853">the</span>
        <span id="w854">party&#8212;</span><span id="w855">especially</span>
        <span id="w856">Prince</span>
        <span id="w857">Pete!</span>
      </span>
    </p>
    <p class="no-indent" style="line-height: normal !important;">
      <span class="font-4a" style="color:#FFFFFF;">
        <span id="w858">&#8220;I</span>
        <span id="w859">owe</span>
        <span id="w860">this</span>
        <span id="w861">all</span>
        <span id="w862">to</span>
        <span id="w863">you,</span>
        <span id="w864">Goofyfella,&#8221;</span>
        <span id="w865">he</span>
        <span id="w866">says.</span>
        <span id="w867">&#8220;How</span>
        <span id="w868">can</span>
        <span id="w869">I</span>
        <span id="w870">repay</span>
        <span id="w871">you?&#8221;</span>
      </span>
    </p>
    <p class="no-indent" style="line-height: normal !important;">
      <span class="font-4a" style="color:#FFFFFF;">
        <span id="w872">&#8220;Well,</span>
        <span id="w873">I&#8217;m</span>
        <span id="w874">looking</span>
        <span id="w875">for</span>
        <span id="w876">the</span>
        <span id="w877">gold</span>
        <span id="w878">storybook,&#8221;</span>
        <span id="w879">Goofyfella</span>
        <span id="w880">says.</span>
      </span>
    </p>
    <p class="no-indent" style="line-height: normal !important;">
      <span class="font-4a" style="color:#FFFFFF;">
        <span id="w881">&#8220;If</span>
        <span id="w882">the</span>
        <span id="w883">book</span>
        <span id="w884">is</span>
        <span id="w885">in</span>
        <span id="w886">my</span>
        <span id="w887">library,&#8221;</span>
        <span id="w888">says</span>
        <span id="w889">Prince</span>
        <span id="w890">Pete,</span>
        <span id="w891">&#8220;it&#8217;s</span>
        <span id="w892">yours.&#8221;</span>
      </span>
    </p>
