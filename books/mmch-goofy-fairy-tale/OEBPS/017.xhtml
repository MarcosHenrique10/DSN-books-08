    <p class="no-indent" style="line-height: normal !important;">
      <span class="font-4a">
        <span id="w690">&#8220;We&#8217;ve</span>

    </p>
    <p class="no-indent" style="line-height: normal !important;">
      <span class="font-4a">
        <span id="w700">&#8220;But</span>
        <span id="w701">we&#8217;re</span>

        <span id="w710">hear</span>
        <span id="w711">us</span>
        <span id="w712">knocking.&#8221;</span>
      </span>
    </p>
    <p class="no-indent" style="line-height: normal !important;">
      <span class="font-4a">
        <span id="w713">&#8220;I&#8217;ll</span>

        <span id="w715">ring</span>
        <span id="w716">this</span>
        <span id="w717">bell,&#8221;</span>

        <span id="w722">pulls</span>

        <span id="w724">the</span>
