    <p>
      <span class="font-7">
        <span id="w164">Mickey</span>
        <span id="w165">looked</span>
        <span id="w166">longingly</span>
        <span id="w167">at</span>
        <span id="w168">the</span>
        <span id="w169">magic</span>
        <span id="w170">hat.</span>
      </span>
    </p>
    <p>
      <span class="font-7">
        <span id="w171">Ever</span>
        <span id="w172">so</span>
        <span id="w173">slowly,</span>
        <span id="w174">he</span>
        <span id="w175">reached</span>
        <span id="w176">for</span>
        <span id="w177">it.</span>
      </span>
    </p>
    <p>
      <span class="font-7">
        <span id="w178">Ever</span>
        <span id="w179">so</span>
        <span id="w180">gently,</span>
        <span id="w181">he</span>
        <span id="w182">took</span>
        <span id="w183">it</span>
        <span id="w184">off</span>
        <span id="w185">the</span>
        <span id="w186">table.</span>
      </span>
    </p>
    <p>
      <span class="font-7">
        <span id="w187">Ever</span>
        <span id="w188">so</span>
        <span id="w189">carefully,</span>
        <span id="w190">he</span>
        <span id="w191">raised</span>
        <span id="w192">it</span>
        <span id="w193">into</span>
        <span id="w194">the</span>
        <span id="w195">air.</span>
      </span>
    </p>
    <p>
      <span class="font-7">
        <span id="w196">Ever</span>
        <span id="w197">so</span>
        <span id="w198">proudly,</span>
        <span id="w199">he</span>
        <span id="w200">lowered</span>
        <span id="w201">it</span>
        <span id="w202">onto</span>
        <span id="w203">his</span>
        <span id="w204">head.</span>
      </span>
    </p>
    <p>
      <span class="font-7">
        <span id="w205">Finally,</span>
        <span id="w206">he</span>
        <span id="w207">would</span>
        <span id="w208">be</span>
        <span id="w209">a</span>
        <span id="w210">sorcerer,</span>
        <span id="w211">too.</span>
        <br/>
      </span>
    </p>
